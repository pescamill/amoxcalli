name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # La aplicación usa solo la biblioteca estándar. El laboratorio LLM archivado (experiments/llm/)
      # no forma parte del CI.
      - run: npm ci --ignore-scripts
      - name: Informes medidos vigentes
        run: make check
      - name: Suite Python
        run: make test-py
      - name: Suite DOM
        run: make test-ui
